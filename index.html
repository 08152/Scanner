<body>

<div class="app">

<header class="header">
    <h1>Ultra 3D Scanner</h1>
    <p>
        Fotos hochladen und daraus ein echtes
        3D-Modell berechnen.
    </p>
</header>


<section class="card">

    <div class="info-grid">

        <div class="info">
            <span class="info-value">100</span>
            <span class="info-label">Fotos maximal</span>
        </div>

        <div class="info">
            <span class="info-value">30K</span>
            <span class="info-label">Textur-Ziel</span>
        </div>

        <div class="info">
            <span class="info-value">750M</span>
            <span class="info-label">Dreiecks-Ziel</span>
        </div>

    </div>

</section>


<section class="card">

    <label
        class="upload-area"
        id="uploadArea"
        for="photos"
    >

        <div class="upload-icon">📷</div>

        <div class="upload-title">
            Fotos auswählen
        </div>

        <div class="upload-description">
            50–100 Fotos empfohlen.
            <br>
            JPG, PNG oder WebP.
            <br>
            Dateien können auch hierher gezogen werden.
        </div>

    </label>

    <input
        id="photos"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        multiple
    >

    <div
        class="file-count"
        id="fileCount"
    >
        Noch keine Fotos ausgewählt.
    </div>

    <button
        class="main-button"
        id="createButton"
        disabled
    >
        3D-MODELL ERSTELLEN
    </button>

</section>


<section class="card">

    <div class="status-title">
        Status
    </div>

    <div
        class="status-message"
        id="statusMessage"
    >
        Bereit.
    </div>

    <div class="progress">

        <div
            class="progress-bar"
            id="progressBar"
        ></div>

    </div>

    <div
        class="scan-id"

</section>

    </h2>

            id="modelViewer"

            touch-action="pan-y"
            auto-rotate

            exposure="1"
        ></model-viewer>

    </div>

    <div class="viewer-help">
        Finger bewegen: Modell drehen
        <br>
        Zwei Finger: zoomen
    </div>

</section>


<section
    class="card download-card"
    id="downloadCard"
>

    <h2>
        Modell herunterladen
    </h2>

    <div
        class="download-list"
        id="downloadList"
    ></div>

</section>

</div>


<script
    type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"
></script>


<script>

const photos =
    document.getElementById("photos");

const uploadArea =
    document.getElementById("uploadArea");

const fileCount =
    document.getElementById("fileCount");

const createButton =
    document.getElementById("createButton");

const statusMessage =
    document.getElementById("statusMessage");

const progressBar =
    document.getElementById("progressBar");

const viewerCard =
    document.getElementById("viewerCard");

const modelViewer =
    document.getElementById("modelViewer");

const downloadCard =
    document.getElementById("downloadCard");

const downloadList =
    document.getElementById("downloadList");

const scanIdElement =
    document.getElementById("scanId");


let selectedFiles = [];

let currentScanId = null;


/* =========================================================
   BILDER
========================================================= */

function isImage(file) {

    return [
        "image/jpeg",
        "image/png",
        "image/webp"
    ].includes(file.type);
}


photos.addEventListener(
    "change",
    () => {

        selectedFiles =
            Array.from(
                photos.files
            )
            .filter(isImage)
            .slice(0, 100);

        updateFileCount();
    }
);


/* =========================================================
   DRAG & DROP
========================================================= */

uploadArea.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

        uploadArea.classList.add(
            "drag"
        );
    }
);


uploadArea.addEventListener(
    "dragleave",
    () => {

        uploadArea.classList.remove(
            "drag"
        );
    }
);


uploadArea.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        uploadArea.classList.remove(
            "drag"
        );

        selectedFiles =
            Array.from(
                event.dataTransfer.files
            )
            .filter(isImage)
            .slice(0, 100);

        updateFileCount();
    }
);


/* =========================================================
   DATEIANZAHL
========================================================= */

function updateFileCount() {

    const count =
        selectedFiles.length;

    if (count === 0) {

        fileCount.textContent =
            "Noch keine Fotos ausgewählt.";

        createButton.disabled =
            true;

        return;
    }

    fileCount.textContent =
        `${count} Foto${count === 1 ? "" : "s"} ausgewählt.`;

    createButton.disabled =
        count < 3;
}


/* =========================================================
   SCAN STARTEN
========================================================= */

createButton.addEventListener(
    "click",
    startScan
);


async function startScan() {

    if (
        selectedFiles.length < 3
    ) {

        setError(
            "Bitte mindestens 3 Fotos auswählen."
        );

        return;
    }


    createButton.disabled =
        true;


    viewerCard.style.display =
        "none";


    downloadCard.style.display =
        "none";


    downloadList.innerHTML =
        "";


    scanIdElement.textContent =
        "";


    setProgress(5);

    setStatus(
        "Fotos werden hochgeladen..."
    );


    const formData =
        new FormData();


    for (
        const file of selectedFiles
    ) {

        formData.append(
            "photos",
            file
        );
    }


    try {

        /*
         * WICHTIG:
         * Der Server verwendet /api/upload.
         */

        const response =
            await fetch(
                "/api/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                `Server antwortete mit HTTP ${response.status}.`
            );
        }


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Upload fehlgeschlagen."
            );
        }


        if (
            !data.scanId
        ) {

            throw new Error(
                "Der Server hat keine Scan-ID zurückgegeben."
            );
        }


        currentScanId =
            data.scanId;


        scanIdElement.textContent =
            "Scan-ID: " +
            currentScanId;


        setProgress(10);


        setStatus(
            `Upload fertig. ${data.photos} Fotos werden verarbeitet...`
        );


        pollStatus();


    } catch (
        error
    ) {

        console.error(
            error
        );


        setError(
            error.message
        );


        createButton.disabled =
            false;
    }
}


/* =========================================================
   STATUS ABFRAGEN
========================================================= */

async function pollStatus() {

    if (
        !currentScanId
    ) {

        return;
    }


    try {

        const response =
            await fetch(
                `/api/status/${encodeURIComponent(currentScanId)}`
            );


        const text =
            await response.text();


        let data;


        try {

            data =
                JSON.parse(text);

        } catch {

            throw new Error(
                `Status-Server antwortete mit HTTP ${response.status}.`
            );
        }


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Status konnte nicht gelesen werden."
            );
        }


        /*
         * SERVER:
         *
         * state
         * step
         * progress
         */

        setStatus(
            data.step ||
            "Berechnung läuft..."
        );


        setProgress(
            data.progress || 0
        );


        if (
            data.state ===
            "finished"
        ) {

            showFinished(
                data
            );

            return;
        }


        if (
            data.state ===
            "error"
        ) {

            setError(
                data.error ||
                "Die 3D-Berechnung ist fehlgeschlagen."
            );

            createButton.disabled =
                false;

            return;
        }


        setTimeout(
            pollStatus,
            3000
        );


    } catch (
        error
    ) {

        console.error(
            error
        );


        setError(
            error.message
        );


        setTimeout(
            pollStatus,
            5000
        );
    }
}


/* =========================================================
   FERTIG
========================================================= */

function showFinished(
    data
) {

    setProgress(
        100
    );


    setSuccess(
        "✅ 3D-Modell ist fertig!"
    );


    const files =
        Array.isArray(
            data.files
        )
            ? data.files
            : [];


    const model =
        data.model ||
        files.find(
            file =>
                file
                    .toLowerCase()
                    .endsWith(
                        ".glb"
                    )
        );


    if (
        model
    ) {

        const modelPath =
            model
                .split("/")
                .map(
                    part =>
                        encodeURIComponent(
                            part
                        )
                )
                .join("/");


        const modelUrl =
            `/api/download/` +
            `${encodeURIComponent(currentScanId)}/` +
            modelPath;


        console.log(
            "MODELL:",
            modelUrl
        );


        modelViewer.src =
            modelUrl;


        viewerCard.style.display =
            "block";
    }


    downloadList.innerHTML =
        "";


    for (
        const file of files
    ) {

        const button =
            document.createElement(
                "a"
            );


        const filePath =
            file
                .split("/")
                .map(
                    part =>
                        encodeURIComponent(
                            part
                        )
                )
                .join("/");


        button.className =
            "download-button";


        button.href =
            `/api/download/` +
            `${encodeURIComponent(currentScanId)}/` +
            filePath;


        button.download =
            file
                .split("/")
                .pop();


        button.textContent =
            "⬇️ " +
            file
                .split("/")
                .pop();


        downloadList.appendChild(
            button
        );
    }


    if (
        files.length > 0
    ) {

        downloadCard.style.display =
            "block";
    }


    createButton.disabled =
        false;
}


/* =========================================================
   UI
========================================================= */

function setStatus(
    message
) {

    statusMessage.className =
        "status-message";

    statusMessage.textContent =
        message;
}


function setError(
    message
) {

    statusMessage.className =
        "status-message error";

    statusMessage.textContent =
        "❌ " +
        message;
}


function setSuccess(
    message
) {

    statusMessage.className =
        "status-message success";

    statusMessage.textContent =
        message;
}


function setProgress(
    value
) {

    value =
        Number(value) || 0;


    value =
        Math.max(
            0,
            Math.min(
                100,
                value
            )
        );


    progressBar.style.width =
        `${value}%`;
}

</script>

</body>
</html>
