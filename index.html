<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>3D Fotoscanner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #08090c;
            color: #ffffff;
        }

        body {
            display: grid;
            grid-template-rows: 60px minmax(0, 1fr);
        }

        header {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #25272d;
            background: #101217;
        }

        .brand {
            font-size: 19px;
            font-weight: 700;
            white-space: nowrap;
        }

        #status {
            max-width: 55%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
            color: #b8bcc4;
        }

        main {
            min-height: 0;
            min-width: 0;
            display: grid;
            grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
            gap: 12px;
            padding: 12px;
        }

        .panel {
            min-width: 0;
            min-height: 0;
            overflow: auto;
            padding: 14px;
            border: 1px solid #262930;
            border-radius: 16px;
            background: #111318;
        }

        .viewer {
            min-width: 0;
            min-height: 0;
            position: relative;
            overflow: hidden;
            border: 1px solid #262930;
            border-radius: 16px;
            background: #050608;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        .drop {
            width: 100%;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            border: 2px dashed #41454f;
            border-radius: 14px;
            background: #0d0f13;
            cursor: pointer;
        }

        .drop.active {
            border-color: #ffffff;
            background: #161922;
        }

        input[type="file"] {
            display: none;
        }

        .section {
            width: 100%;
            margin-top: 12px;
        }

        .label {
            display: block;
            margin-bottom: 7px;
            font-size: 12px;
            color: #a9adb5;
        }

        select,
        button {
            width: 100%;
            min-height: 44px;
            border: 1px solid #30343c;
            border-radius: 12px;
            padding: 10px 12px;
            background: #1a1d23;
            color: #ffffff;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .info {
            width: 100%;
            padding: 12px;
            border: 1px solid #22252c;
            border-radius: 12px;
            background: #0b0d11;
        }

        .infoLine {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin: 5px 0;
            font-size: 12px;
        }

        .infoLine span:first-child {
            color: #9297a0;
        }

        .infoLine span:last-child {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .progressWrap {
            width: 100%;
            margin-top: 12px;
        }

        .progress {
            width: 100%;
            height: 9px;
            overflow: hidden;
            border-radius: 999px;
            background: #25282e;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.12s linear;
        }

        #progressText {
            margin-top: 7px;
            font-size: 12px;
            color: #b7bbc3;
        }

        #log {
            width: 100%;
            height: 150px;
            margin-top: 12px;
            padding: 10px;
            overflow: auto;
            border: 1px solid #20242a;
            border-radius: 12px;
            background: #07080b;
            color: #afb4bd;
            font: 11px/1.45 Consolas, monospace;
            white-space: pre-wrap;
        }

        .viewerTop {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
        }

        .badge {
            padding: 8px 10px;
            border: 1px solid #2b2f37;
            border-radius: 10px;
            background: rgba(11, 13, 17, 0.82);
            font-size: 12px;
            color: #c7cad0;
            backdrop-filter: blur(8px);
        }

        .hint {
            width: 100%;
            margin-top: 10px;
            font-size: 11px;
            line-height: 1.45;
            color: #7f848d;
        }

        @media (max-width: 820px) {
            body {
                grid-template-rows: 56px minmax(0, 1fr);
            }

            header {
                height: 56px;
            }

            main {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(0, 1fr) auto;
            }

            .viewer {
                min-height: 45vh;
            }

            .panel {
                max-height: 50vh;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="brand">3D Fotoscanner</div>
        <div id="status">Bereit</div>
    </header>

    <main>
        <aside class="panel">
            <label
                class="drop"
                id="dropZone"
                for="photoInput"
            >
                <div>
                    <strong>Fotos auswählen</strong>
                    <br>
                    <span>
                        2–200 Bilder
                    </span>
                </div>
            </label>

            <input
                id="photoInput"
                type="file"
                accept="image/jpeg,image/png,image/webp"
                multiple
            >

            <div class="section">
                <div class="info">
                    <div class="infoLine">
                        <span>Fotos</span>
                        <span id="photoCount">0</span>
                    </div>

                    <div class="infoLine">
                        <span>Renderziel</span>
                        <span>120 FPS</span>
                    </div>

                    <div class="infoLine">
                        <span>Texturziel</span>
                        <span>30K</span>
                    </div>

                    <div class="infoLine">
                        <span>Meshziel</span>
                        <span>750M</span>
                    </div>
                </div>
            </div>

            <div class="section">
                <span class="label">
                    Qualitätsstufe
                </span>

                <select id="quality">
                    <option value="draft">
                        Draft
                    </option>

                    <option
                        value="high"
                        selected
                    >
                        High
                    </option>

                    <option value="ultra">
                        Ultra
                    </option>
                </select>
            </div>

            <div class="section two">
                <button
                    id="startButton"
                >
                    Scan starten
                </button>

                <button
                    id="resetButton"
                >
                    Zurücksetzen
                </button>
            </div>

            <div class="section">
                <button
                    id="exportButton"
                    disabled
                >
                    Modell exportieren
                </button>
            </div>

            <div class="progressWrap">
                <div class="progress">
                    <div id="progressBar"></div>
                </div>

                <div id="progressText">
                    0%
                </div>
            </div>

            <div id="log"></div>

            <div class="hint">
                Die Oberfläche und die 3D-Vorschau laufen direkt im Browser.
                GitHub Pages kann diese statische Anwendung ausliefern.
            </div>
        </aside>

        <section class="viewer">
            <div class="viewerTop">
                <div
                    class="badge"
                    id="fpsBadge"
                >
                    0 FPS
                </div>

                <div
                    class="badge"
                    id="modelBadge"
                >
                    Kein Modell
                </div>
            </div>

            <canvas id="canvas"></canvas>
        </section>
    </main>

    <script
        type="module"
        src="./app.js"
    ></script>
</body>
</html>
