<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>3D Fotoscanner</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0b0d;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 14px;
            border-bottom: 1px solid #242428;
            background: #111114;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 18px;
        }

        #status {
            font-size: 13px;
            opacity: 0.8;
            text-align: right;
        }

        main {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #050507;
            touch-action: none;
        }

        .panel {
            position: absolute;
            left: 12px;
            top: 12px;
            width: min(390px, calc(100% - 24px));
            padding: 14px;
            background: rgba(17, 17, 20, 0.94);
            border: 1px solid #29292e;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            z-index: 5;
        }

        .drop {
            border: 2px dashed #404047;
            border-radius: 14px;
            padding: 20px 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .drop.active {
            border-color: #fff;
        }

        input[type="file"] {
            display: none;
        }

        button,
        select {
            width: 100%;
            min-height: 44px;
            border: 0;
            border-radius: 12px;
            margin-top: 8px;
            padding: 10px 12px;
            font-size: 15px;
            background: #232329;
            color: white;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .progress {
            height: 8px;
            margin-top: 12px;
            background: #25252a;
            border-radius: 999px;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 100%;
            background: white;
            transition: width 0.2s linear;
        }

        #progressText {
            margin-top: 8px;
            font-size: 13px;
        }

        #filesText {
            margin-top: 8px;
            font-size: 13px;
            opacity: 0.75;
        }

        #log {
            margin-top: 12px;
            height: 130px;
            overflow: auto;
            padding: 10px;
            border-radius: 10px;
            background: #09090b;
            color: #bfc0c6;
            font-family: Consolas, monospace;
            font-size: 11px;
            white-space: pre-wrap;
        }

        .small {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            .panel {
                top: auto;
                bottom: 12px;
            }

            #log {
                height: 100px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>3D Fotoscanner</h1>
    <div id="status">Bereit</div>
</header>

<main>
    <canvas id="canvas"></canvas>

    <section class="panel">

        <label
            class="drop"
            id="dropZone"
            for="photos"
        >
            Fotos auswählen<br>
            <span class="small">
                20–200 überlappende Bilder
            </span>
        </label>

        <input
            id="photos"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            multiple
        >

        <div id="filesText">
            Keine Bilder ausgewählt
        </div>

        <select id="quality">
            <option value="draft">Draft</option>
            <option value="showcase" selected>Showcase</option>
            <option value="ultra">Ultra</option>
        </select>

        <div class="row">
            <button id="startButton">
                Scan starten
            </button>

            <button
                id="pauseButton"
                disabled
            >
                Pause
            </button>
        </div>

        <button
            id="finishButton"
            disabled
        >
            Jetzt beenden & exportieren
        </button>

        <button
            id="downloadButton"
            disabled
        >
            PLY herunterladen
        </button>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <div id="progressText">
            0%
        </div>

        <div id="log"></div>

        <div class="small">
            Die Verarbeitung läuft im Browser.
        </div>

    </section>
</main>

<script
    type="module"
    src="./app.js"
></script>

</body>
</html>
